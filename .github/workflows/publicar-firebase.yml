# Publica CONTADOR SERIES LORENZITO en Firebase (neat-motif-237214.web.app)
# cada vez que cambia el código de codigo-fuente/. Igual que hacía scripts/deploy_web.ps1.
name: Publicar en Firebase

on:
  push:
    branches: [main]
    paths: ['codigo-fuente/**']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codigo-fuente
    steps:
      - name: Comprobar llave de Firebase
        id: llave
        working-directory: .
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$LLAVE" ]; then echo "Falta la llave FIREBASE_SERVICE_ACCOUNT: no se publica."; echo "ok=no" >> $GITHUB_OUTPUT; else echo "ok=si" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.llave.outputs.ok == 'si'
      - uses: subosito/flutter-action@v2
        if: steps.llave.outputs.ok == 'si'
        with:
          channel: stable
          cache: true
      - name: Compilar web (número de versión automático)
        if: steps.llave.outputs.ok == 'si'
        run: |
          flutter pub get
          flutter build web --release --build-number=$((42 + ${{ github.run_number }}))
      - uses: actions/setup-node@v4
        if: steps.llave.outputs.ok == 'si'
        with:
          node-version: 20
      - name: Publicar en Firebase Hosting
        if: steps.llave.outputs.ok == 'si'
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          set +e
          npx -y firebase-tools@15.34.0 deploy --only hosting --project neat-motif-237214 --non-interactive > "$RUNNER_TEMP/salida.txt" 2>&1
          r=$?
          rm -f "$RUNNER_TEMP/llave.json"
          if [ $r -ne 0 ]; then tail -n 12 "$RUNNER_TEMP/salida.txt" | grep -v '^\s*$' | while IFS= read -r l; do echo "::error::$l"; done; exit $r; fi
          tail -n 5 "$RUNNER_TEMP/salida.txt"
