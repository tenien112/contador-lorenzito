name: contador_series_lorenzito
description: "Gym tracker app for counting sets and tracking workout time"
publish_to: 'none'
version: 1.0.0+42

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  google_mobile_ads: ^5.3.0
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  wakelock_plus: ^1.4.0
  universal_ble: ^1.2.0
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "web/icons/Icon-512.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
